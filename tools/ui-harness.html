<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>fleurpilot ui harness</title>
<script>
/* ?css=<href> 可换一份样式表，用来做「同一份 DOM、两份 CSS」的前后对照截图；
   不传就用仓库里的 ../styles.css。href 里只允许安全字符，避免参数注入到标签里。 */
document.write('<link rel="stylesheet" href="' +
    ((new URLSearchParams(location.search).get('css') || '../styles.css').replace(/[<>"'`]/g, '')) + '">');
</script>
<style>
/* 只复刻到「插件样式能看到的那一层」为止：核心布局三层，逐条抄自 Obsidian 1.13 app.css。
   第三层（.view-content）缺了会假阳性，已实测踩过：插件的根元素就是 .view-content
   （ItemView 的 contentEl，等价于 containerEl.children[1]，两个插件都这么挂），核心给它
   12/12/32 的内边距与 overflow:auto —— 不复刻就会量出比真机宽 24px、高 44px 的布局，
   连 @container 阈值都会整体错位一档（容器的 inline-size 量的是内容盒）。 */
:root {
    --background-primary: #ffffff; --background-secondary: #f6f6f4;
    --background-secondary-alt: #eeece8; --background-modifier-hover: rgb(0 0 0 / 0.045);
    --background-modifier-border: rgb(0 0 0 / 0.12); --background-modifier-border-hover: rgb(0 0 0 / 0.2);
    --text-normal: #1f1f1d; --text-muted: #6b6b66; --text-faint: #99998f;
    --interactive-accent: #2f6fed; --interactive-accent-rgb: 47 111 237;
    --text-on-accent: #ffffff; --font-text-size: 16px;
    --shadow-l: 0px 1.8px 7.3px rgba(0,0,0,.071), 0px 6.3px 24.7px rgba(0,0,0,.112), 0px 15px 30px rgba(0,0,0,.112);
}
/* Obsidian 核心默认档（与主题明暗无关，modal-background 用 var() 跟随上面的明暗档） */
:root {
    --size-4-1: 4px; --size-4-2: 8px; --size-4-3: 12px; --size-4-4: 16px; --size-4-8: 32px;
    --font-ui-medium: 13px; --font-semibold: 600; --line-height-tight: 1.3;
    --setting-items-background: transparent; --setting-items-border-width: 0px;
    --setting-items-border-color: transparent; --setting-items-radius: 8px;
    --size-4-4: 16px; --modal-background: var(--background-primary); --modal-radius: 16px;
    --modal-border-width: 1px; --modal-border-color: var(--background-modifier-border);
    --dialog-width: 520px; --dialog-max-width: 720px; --dialog-max-height: 85vh;
}
html.theme-dark {
    --background-primary: #000000; --background-secondary: #101012;
    --background-secondary-alt: #17171a; --background-modifier-hover: rgb(255 255 255 / 0.07);
    --background-modifier-border: rgb(255 255 255 / 0.14); --background-modifier-border-hover: rgb(255 255 255 / 0.24);
    --text-normal: #e8e8e6; --text-muted: #9a9a95; --text-faint: #6e6e69;
    --interactive-accent: #2997ff; --interactive-accent-rgb: 41 151 255;
    --text-on-accent: #ffffff; --font-text-size: 16px;
    --shadow-l: 0px 1.8px 7.3px rgba(0,0,0,.71), 0px 6.3px 24.7px rgba(0,0,0,.81), 0px 15px 30px rgba(0,0,0,.91);
}
html, body { margin: 0; height: 100%; background: var(--background-secondary-alt); }
/* 核心全局重置：没有它，.view-content 的 12px 内边距会「加宽」而不是「吃进」宽度，
   container query 就会量到 900 而不是真机上的 876 —— 静默假阳性。 */
* { box-sizing: border-box; }
body { font-family: -apple-system, 'SF Pro Text', sans-serif; }
/* 核心右栏是工作区网格里的一格，真机上高度是确定的（.workspace 是 position:absolute; inset:0）。
   样机里补这一条是为了跟真机的框一致，别当成「不写就塌」——实测过：不写这条，高度链照样
   解析到视口高（fullHeight=1），塌的不是它。截图里 composer 下方那条空带是 --screenshot
   按**窗口**尺寸截、视口比窗口小 87px 造成的，已在 shots.mjs 改用 CDP 视口钉死修掉。 */
.workspace-split.mod-right-split { width: var(--w, 360px); height: 100%; }
/* 核心第一层：flex 列 + 100% 高，是 .view-content 百分比高度的参照物 */
.workspace-leaf-content {
    width: 100%; height: 100%; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    background: var(--background-primary);
}
/* 核心第二层：右栏的 .view-content 高度取满；插件根元素同时也是它 */
.view-content { width: 100%; height: 100%; overflow: auto; }
/* 核心第三层：内边距直接压在插件根元素上（插件没有重置它的规则） */
.workspace-leaf-content .view-content {
    padding: var(--size-4-3) var(--size-4-3) var(--size-4-8);
}
.modal-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / .45); z-index: 900; }
/* 核心 .modal / .modal-content 逐条抄自 Obsidian 1.13 app.css（obsidian.asar 实测），
   不抄这层就会假阳性：真实 DOM 里 mb-inline-edit-modal 挂在 .modal-content 上，
   卡片本体是外层 .modal，核心给它 padding: var(--size-4-4) + border + radius。 */
.modal {
    background-color: var(--modal-background); border-radius: var(--modal-radius);
    border: var(--modal-border-width) solid var(--modal-border-color);
    padding: var(--size-4-4); position: relative; min-height: 100px;
    width: var(--dialog-width); max-width: var(--dialog-max-width); max-height: var(--dialog-max-height);
    display: flex; flex-direction: column; overflow: auto; box-sizing: border-box;
}
.modal-content { flex: 1 1 auto; font-size: var(--font-ui-medium); }
/* 核心 .modal-close-button：真机 DOM 里它是 modalEl 的直接子元素
   （obsidian.asar 实测：this.modalEl.createDiv("modal-close-button mod-raised")），
   不抄这层就测不出「插件样式到底作用没作用到它」（2026-10-16 实锤插件旧规则
   .mb-inline-edit-modal .modal-close-button 要求它当后代，永不匹配）。 */
.modal-close-button {
    position: absolute; top: var(--size-2-3, 10px); inset-inline-end: var(--size-2-3, 10px);
    padding: var(--size-2-2, 6px); cursor: pointer; background-color: transparent;
    display: flex; align-items: center; justify-content: center; border: none;
}
.modal-close-button::before { content: '✕'; font-size: 16px; color: var(--text-muted); }
/* 核心 .setting-item 家族，逐条抄自 obsidian.asar（1.13.x）。
   欢迎页标题与 Modal 标题走的是 new Setting(...).setHeading()，
   真实 DOM 是 .setting-item.setting-item-heading > .setting-item-info > .setting-item-name，
   没有 <h3>。不抄这层，插件 CSS 是否真的作用到标题就测不出来（曾因此漏掉
   「.fleurpilot-welcome h3」这种永不匹配的死选择器）。 */
.setting-item {
    display: flex; align-items: center; row-gap: var(--size-4-3);
    border-radius: var(--setting-items-radius); background-color: var(--setting-items-background);
    padding: var(--size-4-4); margin-bottom: var(--size-4-2);
    border: var(--setting-items-border-width) solid var(--setting-items-border-color);
}
.setting-item > *:first-child { margin-inline-end: var(--size-4-4); }
.setting-item-info { display: flex; flex-direction: column; flex-grow: 1; }
.setting-item-control { display: flex; align-items: center; flex-grow: 0; flex-shrink: 0; }
.setting-item-name { color: var(--text-normal); font-size: var(--font-ui-medium); line-height: var(--line-height-tight); }
.setting-item-heading {
    padding: 0 var(--size-4-4); flex-wrap: wrap; background-color: transparent;
    margin-bottom: var(--size-4-4); border-top: none;
}
/* 图标描边：Obsidian 的 setIcon 把 fill/stroke 写在元素属性上，样机里统一用 CSS 补齐，
   免得渲染成「黑块图标」影响视觉判读（不影响任何尺寸断言）。 */
.svg-icon {
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
}
/* token 探针：断言必须读「实际解析后的值」，不能读 getPropertyValue 的未替换 token 文本 */
#fp-probes { position: fixed; left: 0; top: 0; opacity: 0; pointer-events: none; }
#fp-probes i { display: block; }
#fp-probe-accent { background: var(--fp-fill-accent-soft); width: 8px; height: 8px; }
#fp-probe-accent-faint { background: var(--fp-fill-accent-faint); width: 8px; height: 8px; }
#fp-probe-gutter { width: var(--fp-gutter); height: 4px; }
#fp-probe-body { font-size: var(--fp-text-body); }
#fp-probe-ring { box-shadow: var(--fp-ring); width: 8px; height: 8px; }
#fp-probe-hairline { border-top: var(--fp-hairline); width: 8px; }
#fp-probe-elev { box-shadow: var(--fp-elev-modal); width: 8px; height: 8px; }
</style></head>

<div id="fp-probes">

  <i id="fp-probe-body">x</i><i id="fp-probe-ring"></i><i id="fp-probe-hairline"></i><i id="fp-probe-elev"></i>

           // 「高度自适应」——新 CSS 必须无视这个变量按内容撑开
           m.style.setProperty('--mb-modal-height', (q.get('modalh') || '400') + 'px');
           m.classList.add('mb-size-custom'); }
}
// fs：模拟用户把 Obsidian 基础字号调大（正式库 baseFontSize=21）。必须写在
// documentElement 上：--fp-text-body 这类「引用它的 :root token」的 var() 替换发生在
// 定义处（:root），写 body 上来不及参与替换，继承下去的是已解析的旧值（实测踩过）
if (q.get('fs')) document.documentElement.style.setProperty('--font-text-size', q.get('fs') + 'px');
</script></body></html>
